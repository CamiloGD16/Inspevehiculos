name: Generar Word

on:
  repository_dispatch:
    types: [crear-docx]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
      - run: pip install python-docx
      - run: python generar_docx.py
      - uses: actions/upload-artifact@v2
        with:
          name: reporte
          path: reporte.docx
